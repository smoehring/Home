apiVersion: v1
kind: ConfigMap
metadata:
  name: home-config
  namespace: home
data:
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  Database__AutoMigrate: "false"
  Storage__LocalPath: /data/files
  DataProtection__KeysPath: /data/keys
  AzureAd__Instance: https://login.microsoftonline.com/
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4317
---
# Template only - create the real secret out of band (sealed-secrets/SOPS). Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: home-secrets
  namespace: home
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=home-pg-rw;Database=home;Username=home;Password=CHANGE_ME"
  AzureAd__TenantId: "CHANGE_ME"
  AzureAd__ClientId: "CHANGE_ME"
  AzureAd__ClientSecret: "CHANGE_ME"
