# Simple single-instance PostgreSQL. For backups/HA prefer CloudNativePG (see docs/DesignDocumentation.md 7.2).
apiVersion: v1
kind: Service
metadata: { name: home-pg-rw, namespace: home }
spec:
  selector: { app: home-pg }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: home-pg, namespace: home }
spec:
  serviceName: home-pg-rw
  replicas: 1
  selector: { matchLabels: { app: home-pg } }
  template:
    metadata: { labels: { app: home-pg } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: home }
            - { name: POSTGRES_USER, value: home }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: home-pg-auth, key: password } }
          readinessProbe: { exec: { command: ["pg_isready", "-U", "home"] }, periodSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 10Gi } }
