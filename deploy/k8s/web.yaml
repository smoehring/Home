apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: home-data, namespace: home }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 50Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: home-web, namespace: home }
spec:
  replicas: 1 # ReadWriteOnce file storage: keep at 1 (see design doc 5.1)
  strategy: { type: Recreate }
  selector: { matchLabels: { app: home-web } }
  template:
    metadata: { labels: { app: home-web } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, fsGroup: 1654, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: ghcr.io/smoehring/home:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: home-config }
            - secretRef: { name: home-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe: { httpGet: { path: /health/live, port: 8080 }, failureThreshold: 30, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /health/live, port: 8080 }, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /health/ready, port: 8080 }, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: home-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: home-web, namespace: home }
spec:
  selector: { app: home-web }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-web
  namespace: home
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls: [{ hosts: [home.example.com], secretName: home-tls }]
  rules:
    - host: home.example.com
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: home-web, port: { number: 80 } } } }] }
