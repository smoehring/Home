# Local development database only: `docker compose up -d`, then `dotnet run --project src/Home.Web`
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: home, POSTGRES_USER: home, POSTGRES_PASSWORD: home }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
